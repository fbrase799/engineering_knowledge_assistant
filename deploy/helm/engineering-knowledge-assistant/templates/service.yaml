apiVersion: v1
kind: Service
metadata:
  name: {{ include "eka.name" . }}-backend
  labels:
    {{- include "eka.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "eka.name" . }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.service.backendPort }}
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eka.name" . }}-frontend
  labels:
    {{- include "eka.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "eka.name" . }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.service.frontendPort }}
      targetPort: 80
