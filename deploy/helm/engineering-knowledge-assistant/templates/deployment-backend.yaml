apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eka.name" . }}-backend
  labels:
    {{- include "eka.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "eka.name" . }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "eka.name" . }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backendRepository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eka.name" . }}-secrets
                  key: azure-openai-api-key
            - name: AZURE_OPENAI_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "eka.name" . }}-secrets
                  key: azure-openai-endpoint
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eka.name" . }}-secrets
                  key: tavily-api-key
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "eka.name" . }}-secrets
                  key: langsmith-api-key
                  optional: true
            - name: AZURE_OPENAI_API_VERSION
              value: {{ .Values.env.AZURE_OPENAI_API_VERSION | quote }}
            - name: AZURE_OPENAI_DEPLOYMENT
              value: {{ .Values.env.AZURE_OPENAI_DEPLOYMENT | quote }}
            - name: LANGSMITH_TRACING
              value: {{ .Values.env.LANGSMITH_TRACING | quote }}
            - name: LANGSMITH_PROJECT
              value: {{ .Values.env.LANGSMITH_PROJECT | quote }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.env.RATE_LIMIT_PER_MINUTE | quote }}
            - name: REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.env.REQUEST_TIMEOUT_SECONDS | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
