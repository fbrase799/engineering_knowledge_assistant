{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eka.name" . }}-secrets
  labels:
    {{- include "eka.labels" . | nindent 4 }}
type: Opaque
stringData:
  azure-openai-api-key: {{ .Values.secrets.azureOpenAIApiKey | quote }}
  azure-openai-endpoint: {{ .Values.secrets.azureOpenAIEndpoint | quote }}
  tavily-api-key: {{ .Values.secrets.tavilyApiKey | quote }}
  langsmith-api-key: {{ .Values.secrets.langsmithApiKey | quote }}
{{- end }}
