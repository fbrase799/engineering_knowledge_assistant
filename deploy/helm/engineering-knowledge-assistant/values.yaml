replicaCount: 1

image:
  backendRepository: engknowledge/backend
  frontendRepository: engknowledge/frontend
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  backendPort: 8000
  frontendPort: 80

resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

env:
  AZURE_OPENAI_API_VERSION: "2024-10-21"
  AZURE_OPENAI_DEPLOYMENT: gpt-4o-mini
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: engineering-knowledge-assistant
  RATE_LIMIT_PER_MINUTE: "20"
  REQUEST_TIMEOUT_SECONDS: "60"

secrets:
  create: true
  azureOpenAIApiKey: ""
  azureOpenAIEndpoint: ""
  tavilyApiKey: ""
  langsmithApiKey: ""

ingress:
  enabled: false
  host: engknowledge.example.com
  className: nginx
