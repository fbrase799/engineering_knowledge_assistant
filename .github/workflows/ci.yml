name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend test image
        run: docker compose -f docker/compose.yaml --profile test build backend-test
      - name: Lint, test, graph check, eval
        run: docker compose -f docker/compose.yaml --profile test run --rm backend-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend test image
        run: docker compose -f docker/compose.yaml --profile test build frontend-test
      - name: Frontend unit tests
        run: docker compose -f docker/compose.yaml --profile test run --rm frontend-test
      - name: Build frontend runtime image
        run: docker compose -f docker/compose.yaml build frontend
